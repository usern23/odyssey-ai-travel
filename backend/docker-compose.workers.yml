services:
  
  trip-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: odyssey_trip_worker
    working_dir: /app
    volumes:
      - ./src:/app/src
      - ./.env:/app/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/odyssey
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      PYTHONUNBUFFERED: "1"
    command: python -m src.workers.trip_worker
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  chat-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: odyssey_chat_worker
    working_dir: /app
    volumes:
      - ./src:/app/src
      - ./.env:/app/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/odyssey
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      PYTHONUNBUFFERED: "1"
    command: python -m src.workers.chat_worker
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  favorites-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: odyssey_favorites_worker
    working_dir: /app
    volumes:
      - ./src:/app/src
      - ./.env:/app/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/odyssey
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      PYTHONUNBUFFERED: "1"
    command: python -m src.workers.favorites_worker
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: odyssey_rabbitmq
    restart: unless-stopped
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-guest}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  db:
    image: postgis/postgis:16-3.4
    container_name: odyssey_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-odyssey}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-odyssey}"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
  rabbitmq_data:

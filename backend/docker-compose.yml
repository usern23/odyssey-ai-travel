services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: odyssey_app
    working_dir: /app
    volumes:
      - ./src:/app/src
      - ./services:/app/services
      - ./.env:/app/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/odyssey
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      PYTHONUNBUFFERED: "1"
    env_file:
      - .env
    # Migrations are applied automatically on startup by init_models() in gateway lifespan.
    command: >
      sh -c "PYTHONPATH=/app uvicorn services.gateway.main:app --host 0.0.0.0 --port 8000 --reload"
    ports:
      - "${APP_PORT:-8081}:8000"
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: odyssey_rabbitmq
    restart: unless-stopped
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-guest}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  db:
    image: postgis/postgis:16-3.4
    container_name: odyssey_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-odyssey}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-odyssey}"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
  rabbitmq_data: